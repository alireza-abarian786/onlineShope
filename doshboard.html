<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="دیجی استور - فروشگاه اینترنتی محصولات با کیفیت و قیمت مناسب"/>
    <meta name="keywords" content="دیجی استور, فروشگاه اینترنتی, خرید آنلاین, محصولات با کیفیت"/>
    <meta name="author" content="Digi Store" />
    <meta name="theme-color" content="#2563eb" />
    <title>دیجی استور | فروشگاه اینترنتی</title>
    <link rel="icon" href="./src/assets/images/logo.png" type="image/png">


    <!--?----------------------------------------------------------------------------------- CSS font-vazirmatn-->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!--?-------------------------------------------------------------------------------------- CSS font-icon-->
    <link rel="stylesheet" href="./public/vendor/font-icon/bootstrap-icons.min.css">
    <!--?-------------------------------------------------------------------------------------- CSS bootstrap-->
    <link rel="stylesheet" href="./public/vendor/bootstrap/bootstrap.min.css">
    <!--?-------------------------------------------------------------------------------------- CSS swiper-->
    <link rel="stylesheet" href="./public/vendor/swiper/swiper-bundle.min.css">
    <!--?-------------------------------------------------------------------------------------- CSS Glide-->
    <link rel="stylesheet" href="./public/vendor/glide/glide.core.min.css">
    <!--?-------------------------------------------------------------------------------------- CSS aos-->
    <link rel="stylesheet" href="./public/vendor/aos/aos.css">
    <!--?-------------------------------------------------------------------------------------- custom css file link -->
    <link rel="stylesheet" href="src/assets/css/app.css" />
    <link rel="stylesheet" href="src/assets/css/mediaQuery.css" />
</head>
<body>

    <!--!----------------------------------------------------------------------- start loader ---------------------------------------------------------->
    <div class="loader-container">
      <div class="loader">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <!--?----------------------------------------------------------------------- finish loader ---------------------------------------------------------->

    <!--!----------------------------------------------------------------------- start header  ---------------------------------------------------------->
    <header class="mx-auto" role="banner">
      <!--? start menu -->
      <div class="menu-box position-relative d-flex align-items-center justify-content-between flex-row-reverse my-sm-4 my-3 mx-auto dropdown-center">

        <!--? icon bar -->
        <button class="icon-bar d-lg-none d-block mb-1 border-0 bg-transparent" data-bs-target="#offcanvasResponsive" aria-controls="offcanvasResponsive" data-bs-toggle="offcanvas" aria-label="باز کردن منو">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 32 32"
            fill="none"
            stroke="currentcolor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M4 8 L28 8 M4 16 L28 16 M4 24 L28 24" />
          </svg>
        </button>

        <!--? start logo and menu -->
        <div class="container-box-brand d-flex align-items-center justify-content-center flex-row-reverse gap-1 gap-lg-4 align-lg-self-baseline align-self-auto">
          <!--? start container logo -->
          <div class="box-brand gap-2 d-flex align-items-center justify-content-center">
            <!--? logo type -->
            <h1 class="fw-bold m-0">
              دیجی <span class="text-primary">استور</span>
            </h1>

            <!--? logo image -->
            <img
              src="./src/assets/images/logo.webp"
              alt="لوگوی دیجی استور"
              height="32"
              class="d-lg-block d-none"
              loading="lazy"
            />
          </div>

          <!--? end container logo -->

          <!--? start menu -->
          <ul
            class="menu p-0 d-flex flex-lg-row-reverse gap-lg-5 offcanvas-lg offcanvas-start overflow-auto m-0"
            tabindex="-1"
            id="offcanvasResponsive"
            aria-labelledby="offcanvasExampleLabel"
            role="navigation"
          >
            <!--? start container header sidebar -->
            <div class="position-fixed bg-white d-lg-none d-flex flex-column align-items-center justify-content-center p-3 gap-3 shadow-lg" style="width: inherit;">
              <!--? image header sidebar -->
              <img
                src="./src/assets/images/logo.webp"
                alt="لوگوی دیجی استور"
                height="32"
                loading="lazy"
              />

              <h4 class="fw-bold m-0">
                دیجی <span class="text-primary">استور</span>
              </h4>

              <!--? icon-close header sidebar -->
              <button
                type="button"
                class="btn-close icon-close"
                data-bs-dismiss="offcanvas"
                data-bs-target="#offcanvasResponsive"
                aria-label="بستن منو"
              ></button>
            </div>
            <!--? end container header sidebar -->

            <!--? start menu drop-down -->
            <li class="category-menu text-start offcanvas-body flex-grow-0 overflow-visible" role="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
            <!-- <li class="category-menu position-relative text-start offcanvas-body flex-grow-0 overflow-visible" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample"> -->
              
              <!--? arrow menu drop-down -->
              <svg class="icon-category-menu icon-xl-window d-none d-lg-block"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 1024 1024"
                aria-hidden="true"
              >
                <path
                  fill="currentColor"
                  d="M831.872 340.864L512 652.672L192.128 340.864a30.59 30.59 0 0 0-42.752 0a29.12 29.12 0 0 0 0 41.6L489.664 714.24a32 32 0 0 0 44.672 0l340.288-331.712a29.12 29.12 0 0 0 0-41.728a30.59 30.59 0 0 0-42.752 0z"
                />
              </svg>

              <!--? text menu drop-down -->
              <span>دسته بندی محصولات</span>

              <div class="open-slide-child-li text-end p-lg-3 p-1 d-none d-lg-grid category-wrapper-xl" role="menu">
                <!--? data menu category loaded from js -->
              </div>

            </li>
            <!--? end menu drop-down -->


            <div class="d-lg-none collapse category-wrapper-lg" id="collapseExample">
                <!--? data menu category loaded from js -->
            </div>

            <!--? text menu contact -->
            <li class="offcanvas-body flex-grow-0 text-start overflow-visible">
              <a
                class="text-decoration-none"
                href="./contact.html"
                role="menuitem"
                >تماس با ما</a
              >
            </li>

            <!--? text menu about -->
            <li class="offcanvas-body flex-grow-0 text-start overflow-visible">
              <a
                class="text-decoration-none"
                href="./about.html"
                role="menuitem"
                >درباره ما</a
              >
            </li>

            <!--? text menu guide -->
            <li class="offcanvas-body flex-grow-0 text-start overflow-visible">
              <button class="logout-btn text-decoration-none border-0">خروج از حساب</button>
            </li>
          </ul>
          <!--? end menu -->
        </div>
        <!--? end logo and menu -->

        <!--? box apps -->
        <div class="box-apps d-flex align-items-center justify-content-center gap-0 gap-sm-3 flex-sm-row-reverse border-0" role="menu">

          <!--? btn cart -->
          <div class="page shopping-cart-icon position-relative bg-white rounded-circle d-flex align-items-center justify-content-center mb-sm-0">
            <svg style="width: 18px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon-cart"><path d="M2.25 2.25a.75.75 0 0 0 0 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 0 0-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 0 0 0-1.5H5.378A2.25 2.25 0 0 1 7.5 15h11.218a.75.75 0 0 0 .674-.421 60.358 60.358 0 0 0 2.96-7.228.75.75 0 0 0-.525-.965A60.864 60.864 0 0 0 5.68 4.509l-.232-.867A1.875 1.875 0 0 0 3.636 2.25H2.25ZM3.75 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM16.5 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z" /></svg>
            <div class="cart-notification"></div>
          </div>
          <!--? end btn cart -->

          <!--? box cart -->
          <div class="container-shopping-cart">
            <div class="open-cart">
              <div class="cantain-box-goods rounded"></div>
              <!-- <i class="bi bi-arrow-down-circle-fill"></i> -->
              <div class="alert alert-danger alert-cart d-none">
                🛒 هیچ محصولی در سبد موجود نمیباشد
              </div>
              <div class="btn-modol-cart-box d-flex align-items-center justify-content-center flex-column w-100">
                <a href="./cart.html" class="btn btn-success w-100 mb-2 final-buy-cart">نهایی کردن خرید</a>
                <button class="clear-cart-all btn btn-danger w-100">پاک کردن سبد خرید</button>
              </div>
            </div>
          </div>
          <!--? end box cart -->

          <!--? btn login -->
          <a href="" id="login" class="page py-2 ps-2 pe-2 text-decoration-none rounded-5 d-flex align-items-center justify-content-between gap-2" style="background-color: #0f172a">
            <svg class="p-1 rounded-circle" style="width: 35px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 4a4 4 0 1 0 0 8a4 4 0 0 0 0-8m-2 9a4 4 0 0 0-4 4v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1a4 4 0 0 0-4-4z" clip-rule="evenodd" /></svg>
            <span class="text-white d-xl-block d-none w-100 text-center">ورود / عضویت</span>
          </a>
          <!--? end btn login -->

        </div>
        <!--? end box apps -->

      </div>
    </header>
    <!--?----------------------------------------------------------------------- finish header  ---------------------------------------------------------->

    <!--!------------------------------------------------------------------------ start main ------------------------------------------------------------->
    <main>

    </main>
    <!--?------------------------------------------------------------------------ finish main ------------------------------------------------------------->


    
    <!--?----------------------------------------------------------------- JavaScript bootstrap ----------------------------------------------------------->
    <script defer src="./public/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <!--?----------------------------------------------------------------- JavaScript swiper ----------------------------------------------------------->
    <script defer src="./public/vendor/swiper/swiper-bundle.min.js"></script>
    <!--?----------------------------------------------------------------- JavaScript Glide ----------------------------------------------------------->
    <script defer src="./public/vendor/glide/glide.min.js"></script>
    <!--?----------------------------------------------------------------- JavaScript sweetalert2 ----------------------------------------------------------->
    <script defer src="./public/vendor/alert/sweetalert2.all.min.js"></script>
    <!--?----------------------------------------------------------------- JavaScript aos ----------------------------------------------------------->
    <script src="./public/vendor/aos/aos.js"></script>
    <script>AOS.init();</script>
    <!--?----------------------------------------------------------------- custom files  ----------------------------------------------------------->
    <script defer type="module" src="./src/js/components/header.js"></script>
    <script defer type="module" src="./src/js/components/box.js"></script>
    <script defer type="module" src="./src/js/panel/panel.js"></script>
</body>
